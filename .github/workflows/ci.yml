name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # rails-ci with security-scan: false (or no rails-ci) does not run bundler-audit
  audit:
    uses: okamyuji/reusable-workflows/.github/workflows/ruby-audit.yml@v1

  ci:
    # rails-ci has a job that asks for pull-requests: write; without it here the
    # whole workflow fails at startup. The jobs that run code drop back to contents: read.
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@v1
    with:
      lint-command: bundle exec rubocop
      test-command: bundle exec rake
      # Brakeman needs a Rails app; this repo is a set of standalone examples.
      security-scan: false

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
