require:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'Gemfile'

# 教材コードはメソッド長・複雑度の制限を緩和
Metrics/MethodLength:
  Max: 80

Metrics/BlockLength:
  Exclude:
    - '**/*_spec.rb'
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 300

Metrics/ModuleLength:
  Max: 500

Metrics/AbcSize:
  Max: 80

Metrics/CyclomaticComplexity:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 20

Metrics/ParameterLists:
  Max: 8

# 教材としてのコメント密度を許容
Style/Documentation:
  Enabled: false

# frozen_string_literal マジックコメント必須
Style/FrozenStringLiteralComment:
  EnforcedStyle: always

# 日本語コメントを許容
Style/AsciiComments:
  Enabled: false

# 文字列結合を許容（教材コードの可読性のため）
Style/StringConcatenation:
  Enabled: false

# マルチラインブロックチェーンを許容（ActiveRecordクエリビルダのため）
Style/MultilineBlockChain:
  Enabled: false

# RSpec用の設定
RSpec/MultipleExpectations:
  Max: 10

RSpec/ExampleLength:
  Max: 30

RSpec/DescribeClass:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/ExpectActual:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/IteratedExpectation:
  Enabled: false

# 教材コードではis_xxx?やhas_xxx?の命名規則を緩和
Naming/PredicateMethod:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

# 教材コードでは変数名の数字規約を緩和
Naming/VariableNumber:
  Enabled: false

# 教材コードではメソッドパラメータ名の制限を緩和
Naming/MethodParameterName:
  MinNameLength: 1

# 重複ブランチは教材の明示性のために許容
Lint/DuplicateBranch:
  Enabled: false

# 既存の教材は1トピック1ファイルで、説明のモジュールとデモ用のクラスを同じファイルに置く。
# 新しく書くファイルには検査を効かせるため、対象から外すのは既存のファイルだけにする。
Style/OneClassPerFile:
  Exclude:
    - '10_tracepoint_objectspace/tracepoint_objectspace.rb'
    - '13_activerecord_arel/activerecord_arel.rb'
    - '14_connection_pool/connection_pool.rb'
    - '21_solid_cable/solid_cable.rb'
    - '23_activerecord_encryption/activerecord_encryption.rb'
    - '24_generates_token_for/generates_token_for.rb'
    - '26_n_plus_one/n_plus_one.rb'
    - '27_multi_db/multi_db.rb'
    - '28_database_locking/database_locking.rb'
    - '29_batch_processing/batch_processing.rb'
    - '30_query_plan/query_plan.rb'

# 教材コードでは puts を許容
Rails/Output:
  Enabled: false

Naming/FileName:
  Exclude:
    - '**/*_spec.rb'
